[build-system]
requires = ["setuptools==69.5.1"]
build-backend = "setuptools.build_meta"

[project]
name = "hase-bench"
version = "0.1.0"
description = "Manual benchmark framework for coding agents"
requires-python = "==3.12.4"
dependencies = []

[project.optional-dependencies]
dev = [
    "colorama==0.4.6",
    "iniconfig==2.3.0",
    "packaging==26.3",
    "pluggy==1.6.0",
    "pytest==8.3.5",
]

[tool.setuptools.packages.find]
include = ["hasebench*"]

[tool.hasebench]
python-version = "3.12.4"
